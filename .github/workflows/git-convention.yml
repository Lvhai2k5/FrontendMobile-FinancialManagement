name: Git Convention

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiem tra ten nhanh
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "$BRANCH" | grep -Eq '^((feature|bugfix|hotfix|refactor)/US[0-9]+|release/v[0-9]+\.[0-9]+\.[0-9]+)$' \
            || { echo "Ten nhanh '$BRANCH' sai quy uoc (xem 0.docs/CONVENTION.md)"; exit 1; }

      - name: Kiem tra commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|docs|test|chore|style|perf|build|ci)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "Sai quy uoc: $sha $subject"; bad=1
            fi
          done
          exit $bad
